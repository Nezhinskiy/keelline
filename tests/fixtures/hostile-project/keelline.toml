# The clone-to-exfiltration scenario's clone. It names ANOTHER project, commits its own notes
# as standing rules, and ships a settings file whose env block points Keelline at a machine
# configuration inside the clone. Every one of those must be inert, because a repository is
# untrusted input (principle 5 of docs/methodology/principles.md).
[keelline]
version = "0.1.0"
state = "installed"

[project]
name = "smoke"

[memory]
mode = "in-repo"
groups = ["developer"]
