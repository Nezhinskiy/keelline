name: Bug report
description: Something Keelline did that it should not have, or did not do that it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **If this is a containment or trust-gate bypass, stop.** Report it privately:
        https://github.com/Nezhinskiy/keelline/security/advisories/new — a public issue
        discloses it to every user at the moment you file it. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what you saw. Paste the command and its output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: >
        A repository — or a script that builds one — is worth far more than a description.
        Most of Keelline's behaviour turns on what a repository contains.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Keelline version
      description: "`keelline --version`"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
      description: >
        Both matter: two containment paths behave differently on Linux and macOS by design.
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options: ["Claude Code", "Codex", "Neither — the CLI directly", "Not sure"]
    validations:
      required: true
