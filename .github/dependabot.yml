version: 2
updates:
  # The three actions in `ci.yml` are SHA-pinned with a version comment, which is right and is
  # also why they rot silently: nothing tells you a pin is two years old. Dependabot rewrites
  # the SHA *and* the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # Development dependencies only — Keelline has no runtime dependencies, and
  # `tests/test_import_boundary.py` is what keeps it that way.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev:
        patterns: ["*"]
