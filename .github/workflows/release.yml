# .github/workflows/release.yml
#
# The first upload would otherwise have been a hand-run `uv publish` from a laptop, with no
# provenance and an API token sitting in somebody's shell history. This publishes from the tag,
# authenticates with a short-lived OIDC token through PyPI's Trusted Publishing, and attaches
# build attestations — so there is no secret to leak and the artefact says where it came from.
#
# See RELEASING.md for the one-time PyPI registration and the `pypi` environment this needs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Version discipline, against the tag
        # The tag is the claim; these six files are what the claim has to agree with. A tag that
        # names a version no source carries is the one release mistake PyPI will not let you undo.
        run: |
          uv run keelline release check
          tagged="${GITHUB_REF_NAME#v}"
          built="$(uv run python -c 'import keelline; print(keelline.__version__)')"
          test "$tagged" = "$built" || {
            echo "tag $GITHUB_REF_NAME does not match package version $built" >&2
            exit 1
          }
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The last human gate. A tag pushed by mistake waits for an approval here instead of
    # becoming a permanent PyPI release.
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing: no stored API token anywhere
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
