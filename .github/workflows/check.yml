# The reusable workflow a project calls. One job, `gates`: it checks out the caller, checks out
# Keelline at THIS FILE's own commit (no resolver and no build backend; the network is the two
# checkouts and whatever `setup-python` below fetches when the runner has no matching
# interpreter cached), resolves the base branch to one commit, and runs `python3 -P -s -m
# keelline gate` against it twice. The first run reads the base's `keelline.toml`, admits only a change
# that tightens it, and runs the configuration check and the built-in gates, each advisory or
# enforcing as the configuration it admitted says; it executes nothing the repository wrote.
# The second runs the project's own gates from `[gates.custom]`, only once the first passed:
# those commands execute files the pull request can change, with the runner's privileges, and
# must never share a process with the verdict. One job and not one per gate because a job is
# billed by the whole minute, so this spends one runner-minute per push instead of one per
# gate; a caller that wants a check row per gate calls this file from a matrix of its own and
# passes `only:`. Every value that reaches a shell here arrives through `env:`; a `${{ }}`
# spliced into `run:` is a command injection waiting for a ref name that permits it.
#
# **Anchor provenance, said once.**
# - The base branch's NAME is the pull request's base as the platform reports it
#   (`github.base_ref`); the caller's `base:` decides only on events that report none, and on a
#   pull request a `base:` that disagrees is refused. The caller `keelline init` writes runs
#   only for pull requests into the gate branch and passes that branch as a literal `base:`,
#   so a pull request retargeted at a looser branch produces no run at all. The caller file is
#   pull-request content, so all of that holds only under the repository settings
#   `docs/cli.md#the-reusable-workflow` names: CODEOWNERS on `/.github/` with a required review.
# - The base COMMIT is `refs/remotes/origin/<base>` in the caller's own checkout, resolved once
#   to a full sha that every later read uses. A fully qualified name is never shadowed by a tag
#   called `origin/<base>`, and a 40-hex name is never shadowed by anything.
# - The Keelline that runs comes from the platform's own record of which reusable workflow is
#   executing (`job.workflow_repository`, `job.workflow_sha`), never from the caller's inputs.
#   That record names what the caller's `uses:` line pinned, and that line is pull-request
#   content under the same settings. The platform documents no `github.job_workflow_sha`; an
#   undefined property is the empty string, and `actions/checkout` with an empty `ref` checks
#   out the DEFAULT BRANCH, a pin silently turned into a floating ref, so the checkout it got
#   is asserted rather than trusted.
name: keelline-check

on:
  workflow_call:
    inputs:
      base:
        description: "the branch the gates' configuration is read from; empty means the pull request's base, or the repository's default branch on a push"
        type: string
        default: ""
      path:
        description: "the project root inside the caller's checkout, as a plain relative path: letters, digits, '.', '_', '-' and '/' only, and no '..' component. A path with a space, a non-ASCII character or a shell metacharacter is refused, because this value reaches the run's own outputs"
        type: string
        default: "."
      python-version:
        description: "the interpreter Keelline runs on; 3.11 is the floor"
        type: string
        default: "3.13"
      only:
        description: "the checks to run, space-separated: `config` and any configured gate name. Empty runs the configuration check and every configured gate, and the configuration check runs whatever this names. A caller that wants one check row per gate passes one name per leg of its own matrix"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: The caller's repository
        # `fetch-depth: 0` is not a convenience: the base ref, the merge base `plan check`
        # reads and the commit range `commit check` reads all come out of this checkout, and
        # `persist-credentials: false` means there is no token to fetch them with afterwards.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Keelline, at this workflow's own commit
        # The `job.workflow_*` properties are unavailable on GitHub Enterprise Server.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: keelline
          persist-credentials: false
      - name: The checkout is the commit this workflow file is at
        # The assertion that would have caught an empty `ref`: a default-branch checkout
        # answers a different sha. It is also the only thing that turns the Enterprise Server
        # gap above into a refusal rather than into a floating Keelline.
        env:
          EXPECTED: ${{ job.workflow_sha }}
        run: |
          actual="$(git -C keelline rev-parse HEAD)"
          [ "$actual" = "$EXPECTED" ] || { echo "::error::checked out $actual, not the workflow's own $EXPECTED"; exit 1; }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Keelline runs at all
        # First, so that a Keelline that cannot run fails here under its own name, and not as
        # a gate that reads as if it had found something. A bad checkout, a renamed module, or
        # an interpreter below the 3.11 floor (which `inputs.python-version` can name and
        # nothing validates) all land here.
        env:
          PYTHONPATH: keelline/src
        run: python3 -m keelline --version
      - name: The base ref and the project root
        id: base
        working-directory: project
        env:
          INPUT_BASE: ${{ inputs.base }}
          INPUT_PATH: ${{ inputs.path }}
          PR_BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$INPUT_PATH" in
            ""|.|./) p="" ;;
            *) p="${INPUT_PATH#./}"; p="${p%/}" ;;
          esac
          # `p` is appended to `$GITHUB_OUTPUT` below, which the runner parses line by line, so a
          # `path:` carrying a newline would write further `key=value` lines of its own, and
          # `base_sha` is the commit whose configuration governs the gates. A plain relative path
          # is all `path:` has ever meant, and `..` is refused with it so `root=` below stays
          # inside the caller's own checkout lexically.
          case "$p" in
            *[!A-Za-z0-9._/-]*)
              echo "::error::path: must be a plain relative path — letters, digits, '.', '_', '-' and '/'"
              exit 1
              ;;
            ..|../*|*/..|*/../*)
              echo "::error::path: must not leave the checkout"
              exit 1
              ;;
          esac
          # A root reached through a symbolic link is refused by `keelline gate` itself, which
          # both gate steps run before any gate: one implementation of that rule, not two.
          # **On a pull request the platform's answer wins, and a `base:` that disagrees is
          # refused rather than preferred.** The workflow file a `pull_request` run executes comes
          # from the merge commit, the author's copy, and `with: base:` lives in it. A `base:`
          # naming a branch the author pushed would choose the configuration the change is judged
          # against. On a pull request `github.base_ref` is already the right answer, so `base:`
          # only ever decides anything on `push`, `merge_group` and `workflow_dispatch`. The
          # author's value is never echoed: it has not been validated yet, and a newline in it
          # would be a workflow command of its own.
          #
          # `path:` is the remaining half and cannot be closed the same way, because the platform
          # reports no answer to compare against. What protects the call site is CODEOWNERS on
          # `/.github/` plus a required review, which is what `docs/cli.md` says.
          if [ -n "$PR_BASE" ] && [ -n "$INPUT_BASE" ] && [ "$INPUT_BASE" != "$PR_BASE" ]; then
            echo "::error::base: names another branch, but this pull request's base is '$PR_BASE'; the gates' configuration is read from the base the platform reports"
            exit 1
          fi
          base="$INPUT_BASE"
          [ -n "$base" ] || base="$PR_BASE"
          [ -n "$base" ] || base="$DEFAULT_BRANCH"
          [ -n "$base" ] || { echo "::error::no base ref: pass 'base:'"; exit 1; }
          git check-ref-format --branch "$base" >/dev/null
          # The fully qualified tracking ref, resolved to a commit here and nowhere else. A short
          # `origin/<base>` would resolve to a tag of that name first. `fetch-depth: 0` has
          # already fetched every branch, and `persist-credentials: false` leaves no token for a
          # second fetch, so a missing ref is an error naming the remedy and never a default.
          base_sha="$(git rev-parse --verify --quiet "refs/remotes/origin/$base^{commit}")" ||
            { echo "::error::origin/$base is not in this checkout — check out with fetch-depth: 0, or name a base that exists"; exit 1; }
          {
            echo "base_sha=$base_sha"
            echo "root=project/${p:-.}"
          } >> "$GITHUB_OUTPUT"
      - name: The configuration and the built-in gates
        # The step that judges. `--builtin` executes no command from `keelline.toml`, and `-P -s`
        # put neither the working directory nor the user site directory on `sys.path`, so nothing
        # the pull request wrote runs in the process that holds the verdict. It may not fail
        # quietly: `keelline gate` already exits 0 for an advisory gate's findings, so
        # `continue-on-error` here could only turn a refusal or an enforced gate's failure green.
        env:
          PYTHONPATH: keelline/src
          ROOT: ${{ steps.base.outputs.root }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ONLY: ${{ inputs.only }}
        run: |
          # `only:` is split on whitespace and never globbed, and each name travels as
          # `--only=NAME`, so it is always that flag's value, whatever it looks like.
          set -f
          only=()
          for name in $ONLY; do only+=("--only=$name"); done
          set +f
          # The configuration check runs whatever `only:` names. `only:` is the caller's, and
          # the caller is pull-request content, so a leg that names one gate still judges the
          # change's `keelline.toml` against the base's; an empty `only:` runs it already.
          if [ "${#only[@]}" -gt 0 ]; then only+=("--only=config"); fi
          python3 -P -s -m keelline gate --builtin --root "$ROOT" --base "$BASE_SHA" \
            --workflow-sha "$WORKFLOW_SHA" --annotate --summary "$GITHUB_STEP_SUMMARY" "${only[@]}"
      - name: The project's own gates
        # The commands `[gates.custom]` names, and only after the step above passed: under the
        # default `if: success()` they never run after a refusal or an enforced built-in's
        # failure, and never `if: always()`. They execute files the pull request can change,
        # with the runner's privileges, so by the time they run the verdict is out of their
        # reach and only their own results are left to them. The runner image and the
        # interpreter above are all they get: a command that needs the project's toolchain
        # installs it itself. The shell is spelled apart from the step above on purpose, so
        # each line an oracle entry names is found once in this file.
        env:
          PYTHONPATH: keelline/src
          ROOT: ${{ steps.base.outputs.root }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ONLY: ${{ inputs.only }}
        run: |
          set -o noglob
          custom=()
          for name in $ONLY; do custom+=("--only=$name"); done
          set +o noglob
          python3 -P -s -m keelline gate --custom --root "$ROOT" --base "$BASE_SHA" \
            --workflow-sha "$WORKFLOW_SHA" --annotate --summary "$GITHUB_STEP_SUMMARY" "${custom[@]}"
