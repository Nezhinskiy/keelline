# .github/workflows/ci.yml
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    # A public repository: anyone can open a pull request, so no job runs unbounded.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux across every supported interpreter, and macOS on one of them.
        #
        # The OS axis is not decoration. `fsops.open_within` branches on `ELOOP` (Linux) *or*
        # `ENOTDIR` (macOS) because O_NOFOLLOW reports a symlinked directory differently on the
        # two, and the `ENOTDIR` arm was reachable only on a developer's laptop — while the
        # absolute-path containment case is the one that completes on Linux specifically,
        # because `/etc` and `/var` are real directories there and symlinks on macOS. The users
        # of a Claude Code / Codex plugin are overwhelmingly on macOS, and macOS runners are
        # free on public repositories. One Python version there holds the job count at four.
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: An interpreter below the floor, for the launcher's version guard
        # `scripts/keelline` is the only thing between a Python 3.9 user and a SyntaxError, and
        # `test_an_old_interpreter_is_refused_with_a_reason` skipped for want of one on every
        # machine that has ever run it — so the guard was asserted nowhere, ever. Before
        # `setup-uv`, so the project's own interpreter still wins on PATH; the test is handed
        # this one by path rather than by searching, and fails rather than skips when it is set.
        id: old-python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        # Coverage, because 2,455 statements of security-sensitive code with nobody able to say
        # which containment branches are exercised is how an untested `..` argument stayed
        # invisible: the walk's loop was covered, just never with an escaping path.
        env:
          KEELLINE_OLD_PYTHON: ${{ steps.old-python.outputs.python-path }}
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=92
      - name: The mutation oracle
        # The plans ask that "every new assertion ships with the mutation that reddens it", and
        # those mutations existed only as English sentences inside multi-thousand-line plan
        # documents: a contributor could satisfy the rule only by hand-editing source and
        # reverting, and a reviewer had no way to check they had. `mutations.toml` is that set as
        # data, and this step is the check. Not a general mutation tester — coverage is the
        # breadth measure; this proves a curated set of guards is load-bearing rather than merely
        # executed, which is the distinction that let `open_within` be fully covered and contain
        # nothing.
        run: uv run python scripts/mutation_oracle.py
      - name: Version discipline
        run: uv run keelline release check
      - name: Build
        run: uv build
      - name: The preset ships inside the wheel
        # CI installs from source, so a packaging regression that dropped the preset would
        # break every `uv tool install` while this workflow stayed green.
        run: |
          uv run python - <<'PY'
          import glob
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert "keelline/presets/recommended.toml" in names, sorted(names)
          print(f"{wheel} carries keelline/presets/recommended.toml")
          PY
      - name: The sdist carries what a downstream packager needs to verify it
        # A packager for Homebrew, Debian or nixpkgs cannot run a single test against an sdist
        # that ships only `src/`, which is the artefact they most need to verify for a
        # security-sensitive tool.
        run: |
          uv run python - <<'PY'
          import glob
          import tarfile

          sdist = sorted(glob.glob("dist/*.tar.gz"))[-1]
          names = tarfile.open(sdist).getnames()
          stripped = {"/".join(n.split("/")[1:]) for n in names}
          for wanted in ("tests/test_fsops.py", "CHANGELOG.md", "scripts/keelline"):
              assert wanted in stripped, (wanted, sorted(stripped)[:40])
          print(f"{sdist} carries the tests, the changelog and the launcher")
          PY

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install Claude Code for the plugin validator
        run: npm install -g @anthropic-ai/claude-code@2.1.261
      - name: Validate each manifest path
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate .codex-plugin/plugin.json
