# .github/workflows/ci.yml
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch, and the newest is the one that counts. A lane that pushes three commits
# to an open pull request in five minutes queues three full matrices, and nobody reads the
# first two answers — measured on this repository: `wp/fsops` alone ran six times. Never on
# `main`: that run is the record that the branch everyone pulls is green, and the next push
# must not cancel it. Public repositories are not billed for standard runners, so this buys
# queue time and clarity rather than money.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    # A public repository: anyone can open a pull request, so no job runs unbounded.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux across every supported interpreter, and macOS on one of them.
        #
        # The OS axis is not decoration. `fsops.open_within` branches on `ELOOP` (Linux) *or*
        # `ENOTDIR` (macOS) because O_NOFOLLOW reports a symlinked directory differently on the
        # two, and the `ENOTDIR` arm was reachable only on a developer's laptop — while the
        # absolute-path containment case is the one that completes on Linux specifically,
        # because `/etc` and `/var` are real directories there and symlinks on macOS. The users
        # of a Claude Code / Codex plugin are overwhelmingly on macOS, and macOS runners are
        # free on public repositories. One Python version there holds the job count at four.
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: An interpreter below the floor, for the launcher's version guard
        # `scripts/keelline` is the only thing between a Python 3.9 user and a SyntaxError, and
        # `test_an_old_interpreter_is_refused_with_a_reason` skipped for want of one on every
        # machine that has ever run it — so the guard was asserted nowhere, ever. Before
        # `setup-uv`, so the project's own interpreter still wins on PATH; the test is handed
        # this one by path rather than by searching, and fails rather than skips when it is set.
        id: old-python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        # Coverage, because 2,455 statements of security-sensitive code with nobody able to say
        # which containment branches are exercised is how an untested `..` argument stayed
        # invisible: the walk's loop was covered, just never with an escaping path.
        env:
          KEELLINE_OLD_PYTHON: ${{ steps.old-python.outputs.python-path }}
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=92
      - name: Version discipline
        run: uv run keelline release check
      - name: Build
        run: uv build
      - name: The artifacts carry what an installed Keelline needs
        # D5: every earlier test resolves the template tree to the checkout; only an artifact
        # can say whether the build backend shipped it.
        run: uv run python scripts/check_artifacts.py dist
      - name: An installed wheel renders the overlay template
        # The wheel is installed into a scratch environment with no checkout in reach, and
        # `overlay create --local` — the one working source for a first overlay — has to find
        # its template tree inside the package.
        run: |
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel/bin/keelline" overlay create --owner ci --name rendered --local --root "$RUNNER_TEMP"
          uv run python scripts/check_artifacts.py rendered "$RUNNER_TEMP/rendered"

  # The mutation oracle, in a job of its own and on one configuration.
  #
  # The plans ask that "every new assertion ships with the mutation that reddens it", and those
  # mutations existed only as English sentences inside multi-thousand-line plan documents: a
  # contributor could satisfy the rule only by hand-editing source and reverting, and a reviewer
  # had no way to check they had. `mutations.toml` is that set as data, and this job is the
  # check. Not a general mutation tester — coverage is the breadth measure; this proves a
  # curated set of guards is load-bearing rather than merely executed, which is the distinction
  # that let `open_within` be fully covered and contain nothing.
  #
  # **Why it is not a step of `checks` any more.** Measured on the last green run, it was 76% of
  # that job: 657 s of an 869 s job on macOS, 751 s of 879 s on Linux, against a 900 s bound. So
  # every configuration sat inside a minute of the cliff, and the branch that took
  # `mutations.toml` from 372 to 382 entries — about +20 s on a 751 s step — pushed
  # `checks (macos-latest, 3.13)` over it at 15m18s. Running it on one configuration instead of
  # four is right and is not sufficient on its own: `timeout-minutes` is a PER-JOB bound, so
  # paying once rather than four times returns 657-751 s to the three configurations that stop
  # running it and nothing at all to the one that still does. That job stayed at ~903 s of 900 s.
  # A job of its own is the only shape where the arithmetic closes, and it also returns the
  # `checks` legs in ~130-210 s instead of ~900 s, with the oracle running beside them rather
  # than inside them.
  #
  # **Why one configuration is enough**, which is the half that had to be checked rather than
  # assumed. The oracle proves "this mutation reddens this test" — a property of the code and of
  # the tests, not of the platform. The matrix comment above argues the OS axis is load-bearing
  # and it is right, but that argument is about the *tests*: `fsops.open_within` branches on
  # `ELOOP` (Linux) against `ENOTDIR` (macOS). Every one of the 401 `reddens` targets, across 68
  # test modules, was resolved to its function and read for skip gates before this was written.
  # The only gates that exist are `shutil.which("git")`, `shutil.which("bash")`, a workflow
  # file's presence, and `os.geteuid() == 0` — none platform-dependent, all satisfied here — and
  # `sys.platform` and `platform.system()` appear nowhere under `tests/`, `src/` or `scripts/`.
  # The errno divergence is absorbed inside one branch rather than by skipping a test, and no
  # entry targets that line.
  #
  # And if a platform gate is ever added to a `reddens` target, this goes red rather than quiet:
  # `_check` runs the clean tree first and demands `Outcome.passed`, which is
  # `code == 0 and executed > 0`, where `executed` subtracts skips and errors. A `reddens` set
  # that does not run here is a finding on the clean run, before the mutation is applied. It is
  # never banked as a proof, which is the failure that would matter.
  oracle:
    runs-on: ubuntu-latest
    # Derived, not rounded. The oracle is 2.02 s per entry on this runner (751 s / 372 entries,
    # measured), so the 387 entries `mutations.toml` now holds cost ~782 s; checkout, `setup-uv`
    # against a warm cache and `uv sync --locked` are the whole of the rest of this job and come
    # to ~60 s, which is the figure to re-measure from this job's first run. Call the shape
    # ~842 s.
    #
    # 19 minutes is 1140 s, so the margin is ~298 s. Sixty of that absorbs runner variance — a
    # nominally 889 s job was cancelled at 918 s, about 30 s of slip, and this doubles it — which
    # leaves ~238 s, or roughly **118 further mutation entries** before this number has to move.
    # At the rate the rule that every assertion ships with its mutation generates them, that is
    # the figure to watch; when it is reached, exactly one job's budget changes and nothing else
    # is hostage to it, which is the third reason this is a job rather than a step.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: The mutation oracle
        run: uv run python scripts/mutation_oracle.py

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install Claude Code for the plugin validator
        run: npm install -g @anthropic-ai/claude-code@2.1.261
      - name: Validate each manifest path
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate .codex-plugin/plugin.json
      - name: The platform's own tag tool agrees with the manifests
        # D12: `claude plugin tag --dry-run` checks the manifest side of "one version"; the
        # six-source gate above checks the rest. A dry run creates nothing.
        run: claude plugin tag --dry-run .
