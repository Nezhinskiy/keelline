# §6.1 permits creating a repository on an account only after explicit confirmation, and in this
# harness the caller is non-interactive: naming the source IS the confirmation. A default turns
# an omitted flag into a private repository created on somebody's GitHub account.
[[mutation]]
name = "overlay create picks the GitHub source when nobody asked for it"
