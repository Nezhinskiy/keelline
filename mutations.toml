# The quiet outcome, declared rather than only covered because the first cut of this hook got
# it backwards and nothing about the code looked wrong. `grep -v` exits 1 when it selects no
# lines, which is exactly the "nothing to strip" case, so hanging the failure report off the
# pipe's status announced a broken strip on every clean commit. `after` below is that exact
# spelling: a false alarm on the ordinary path, on a tool whose whole job is to be trusted
# about what it rewrote.
[[mutation]]
name = "a clean commit is told the strip failed"
file = "src/keelline/guards/githooks.py"
before = '| grep -v "$quiet" >&2 || true'
after = '| grep -v "$quiet" >&2 || echo "$failed" >&2'
reddens = [
  "tests/guards/test_githooks.py::test_the_hook_says_nothing_when_there_was_nothing_to_strip",
]
