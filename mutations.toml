# The `bare commit id` arm already required one digit, so an eight-letter hex word is a word and
# not an id. The whole-tree walk bought the other half of that argument: one hex LETTER, so a
# plain decimal number is a number and not an id. Take the second lookahead away and `uv.lock`
# alone reddens on fifty-five byte counts the resolver rewrites at every lock — a gate whose
# only answer is to exempt a file from itself, which is how an arm gets deleted instead.
# The whole-tree walk skips a file it cannot decode, which is the right answer for a binary and
# the wrong answer for every file at once. `_text` answering `None` turns all 334 parametrised
# cases into skips, and a run of 334 skips and no failures is what a green gate looks like from
# the outside. The floor is therefore on the files that were READ, not on the files that were
# listed, and the count of skips is pinned at the measured zero.
[[mutation]]
name = "the whole-tree gate reads nothing and skips every file"
file = "tests/test_neutral.py"
before = '        return path.read_text(encoding="utf-8")'
after = "        return None"
reddens = [
  "tests/test_neutral.py::test_the_gate_reads_the_whole_tree",
]

