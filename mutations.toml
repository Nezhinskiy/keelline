# recorded" about a machine that was already set up. That property had an entry of its own, on
# the explicit read-back this module used to do beside the spread; it SURVIVED, because the
# spread already held the property and the read-back was dead code shaped like a guard. The
# read-back is gone and the property is declared here, where the code that keeps it is.
