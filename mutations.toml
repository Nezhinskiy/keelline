# The mutation oracle, as data rather than as prose.
#
# The plans set a strong bar — "every new assertion ships with the mutation that reddens it, or
# a sentence saying why none exists" — and the mutations existed only as English sentences
# scattered through multi-thousand-line documents. A contributor could satisfy the rule only by
# hand-editing source and reverting, and a reviewer had no way to check they had. The discipline
# was real and died with the maintainer's memory of it.
#
# Each entry below names a load-bearing line, the change that breaks it, and the test that must
# go red when it does. `scripts/mutation_oracle.py` applies each one, runs only the tests named,
# and fails if any mutation survives. Run it with:
#
#     uv run python scripts/mutation_oracle.py
#
# This is not a coverage substitute and is not exhaustive — `--cov` is the breadth measure. It
# is the set of invariants whose *guard* must be proven to be load-bearing rather than merely
# executed, which is the distinction that let `open_within` be fully covered and still not
# contain anything.

[[mutation]]
name = "the containment walk stops refusing '..'"
file = "src/keelline/fsops.py"
before = '        if part in (_PARENT, _HERE):'
after = '        if part in (_HERE,):'
reddens = ["tests/test_fsops.py::test_a_parent_component_never_leaves_the_root"]

# The oracle found this one itself on its first run: with the explicit check gone, an absolute
# path is still refused — by the empty-first-component rule, because `"/etc".split("/")` starts
# with `""`. The guard is therefore load-bearing for the *message* rather than for the refusal,
# and the test asserts the message, because "refused for a reason nobody wrote down" is how a
# later edit to the empty-component rule would quietly take the absolute case with it.
[[mutation]]
name = "the containment walk stops refusing an absolute path by name"
file = "src/keelline/fsops.py"
before = '    if relative.startswith("/"):'
after = '    if False:'
reddens = ["tests/test_fsops.py::test_an_absolute_path_is_refused"]

