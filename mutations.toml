# The other half of the stale-bytecode predicate, and the direction that costs a person time
# rather than only missing a warning. PEP 552 bytes 8-12 hold the source mtime only while bit 0
# of the flags word is clear; in a hash-based `.pyc` they hold half the source hash, and
# comparing that fragment to an mtime reports a perfectly current cache as stale on every run.
# `SOURCE_DATE_EPOCH` alone flips `py_compile` into that mode, so a reproducible build turns the
# notice into a permanent false alarm and `test hygiene` into a permanent exit 1.
[[mutation]]
