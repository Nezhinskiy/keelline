# A footer had no bounded tail, so ANY line beginning with the words was one whatever followed:
# `Generated with Claude Code and then reviewed by a human.` was an offence, and `commit strip`
# deleted that sentence from the message before the commit existed, reporting only a count. The
# worse of the two failure directions by the module's own docstring — the range check still
# catches a trailer the hook left behind, and nothing puts a deleted sentence back. The
# replacement is the pre-fix pattern exactly: an empty tail is "the line may go on forever".
[[mutation]]
