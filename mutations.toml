# The custom gates execute files the pull request can change. Under the default `if: success()`
# they run only once the judging step passed; `if: always()` would run them after a refusal, in
# a job whose verdict is already failing, and a step that may run whatever came before it is a
# step nothing orders.
[[mutation]]
name = "the custom step runs after a refusal"
file = ".github/workflows/check.yml"
before = """
      - name: The project's own gates
"""
after = """
      - name: The project's own gates
        if: always()
"""
reddens = [
  "tests/test_check_workflow.py::test_one_job_whose_judging_steps_may_not_fail_and_run_in_order",
]

# `--builtin` is what keeps every command from `[gates.custom]` out of the process that decides
# the verdict. Drop it and the judging step runs the pull request's own test suite, `Makefile`
# or script, with the runner's privileges, before its exit status is read.
[[mutation]]
name = "the judging step runs the repository's own gate commands"
file = ".github/workflows/check.yml"
before = '          python3 -P -m keelline gate --builtin --root "$ROOT" --base "$BASE_SHA" \'
after = '          python3 -P -m keelline gate --root "$ROOT" --base "$BASE_SHA" \'
