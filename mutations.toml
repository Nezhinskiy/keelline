# The mirror of the entry above. `entries=None` silently uninstalled the user's wiring;
# entries carrying no marker silently fail to install it, because `owned()` renders the
# marked entries alone and so answers `{}` on both sides of the comparison.
[[mutation]]
name = "a keyed-entries template with unmarked entries silently installs nothing"
file = "src/keelline/scaffold/engine.py"
before = '        if missing := unmarked(template.entries):'
after = '        if (missing := unmarked(template.entries)) and False:'
