# The hint is a fact about NOTIFICATIONS, which only a backgrounded call gets; unkeyed, it
# fires on every foreground `cmd; echo done` a session types.
[[mutation]]
name = "the exit-code hint stops being keyed on the background flag"
file = "src/keelline/guards/bgcleanup.py"
before = '        for hint in (_restore_hint(command), _exit_echo_hint(command) if background else None)'
after = '        for hint in (_restore_hint(command), _exit_echo_hint(command))'
reddens = [
  "tests/guards/test_bgcleanup.py::test_the_same_chain_in_the_foreground_is_silent",
]

# `command_words` is what lets `FOO=1 echo done` be read as an echo; `tail[0]` alone reads
# the assignment and stays silent.
[[mutation]]
name = "the exit-code hint reads the echo's program from the raw first token"
file = "src/keelline/guards/bgcleanup.py"
before = '    words = bashscan.command_words(tail)'
after = '    words = tail'
reddens = [
  "tests/guards/test_bgcleanup.py::test_an_env_prefixed_echo_is_still_an_echo",
]

# The last `;` of a compound statement falls after its terminator, so the masked segment is
# `done` or `fi` alone and the hint advises making a keyword the last command of the chain.
# A backgrounded loop ending in a progress echo is the traffic this rule sits in front of.
[[mutation]]
name = "the exit-code hint names a statement terminator as the masked command"
file = "src/keelline/guards/bgcleanup.py"
before = '    if program in _STATEMENT_KEYWORDS or program in _ECHO_COMMANDS:'
after = '    if program in _ECHO_COMMANDS:'
reddens = [
  "tests/guards/test_bgcleanup.py::test_a_compound_statement_terminator_is_never_named_as_the_masked_command",
]

# `cmd > out.log; echo "----"; echo "EXIT=$?"` masks `cmd`, two breaks back. Naming the second
# echo tells the reader to read the status of an `echo` from the output it wrote.
[[mutation]]
name = "the exit-code hint names a second echo as the masked command"
file = "src/keelline/guards/bgcleanup.py"
before = '    if program in _STATEMENT_KEYWORDS or program in _ECHO_COMMANDS:'
after = '    if program in _STATEMENT_KEYWORDS:'
reddens = [
  "tests/guards/test_bgcleanup.py::test_a_second_echo_is_never_named_as_the_masked_command",
]

# A trailing `;` -- or the trailing newline every editor writes, which the tokenizer turns
# into one -- leaves the last break with an empty tail, and the whole rule falls silent on the
# commonest authoring of the shape it exists for.
[[mutation]]
name = "a trailing separator silences the exit-code hint again"
file = "src/keelline/guards/bgcleanup.py"
before = '    while pieces and pieces[-1] in _CHAIN_OPERATORS:'
after = '    while False:'
reddens = [
  "tests/guards/test_bgcleanup.py::test_a_trailing_separator_does_not_silence_the_hint",
]

# Quoting every piece alike renders `>>` as a literal argument to `echo`, so the text offered
# as "what you typed" is a different command -- in the shape this rule most often sees.
[[mutation]]
name = "the rendered tail quotes its redirect operators into arguments"
file = "src/keelline/guards/bgcleanup.py"
before = '        token if token in bashscan.REDIRECT_OPERATORS else shlex.quote(token)'
after = '        shlex.quote(token)'
reddens = [
  "tests/guards/test_bgcleanup.py::test_the_rendered_tail_keeps_its_redirect_a_redirect",
]

# `&>` and `&>>` are redirects beginning with neither `>` nor `<`, so a first-character test
# walks past them and renders the redirect as part of the masked command's own name.
[[mutation]]
name = "the command head stops on a redirect's first character instead of the table"
file = "src/keelline/guards/bgcleanup.py"
before = '        if piece in bashscan.REDIRECT_OPERATORS:'
after = '        if piece[:1] in {">", "<"}:'
reddens = [
  "tests/guards/test_bgcleanup.py::test_an_ampersand_redirect_is_not_part_of_the_masked_command",
]

# The wrapper is the whole of D11's fail-closed guarantee: Claude Code reads every exit that is
# not 2 as a non-blocking error, so a `closed` entry that stops refusing is a guard that permits.
[[mutation]]
name = "the wrapper stops refusing under a closed policy"
file = "hooks/run-hook.sh"
before = '  if [ "$policy" = closed ]; then refuse "$1"; fi'
after = '  :'
reddens = [
  "tests/hooks/test_wrapper.py::test_no_interpreter_of_the_floor_version_refuses_under_closed_only",
  "tests/hooks/test_wrapper.py::test_any_other_exit_code_becomes_a_refusal_under_closed",
]

# The one failure the wrapper can cause itself. `set -u` alone exits 1 with the shell's own
# message and no token, which reads as permission -- so the disarmed guard would be silent.
[[mutation]]
name = "the wrapper stops noticing that it has no policy argument"
file = "hooks/run-hook.sh"
before = '[ $# -ge 1 ] || refuse "KL_ARGV no policy argument"'
after = 'policy=open'
reddens = ["tests/hooks/test_wrapper.py::test_no_policy_argument_refuses_with_a_token"]

# The marker key and the session id are both payload-controlled. Used verbatim, `../../escape`
# is a write -- and a `remove_within` loop -- outside the one directory D14 permits.
[[mutation]]
name = "the sink stops hashing a payload-controlled path segment"
file = "src/keelline/hooks/sink.py"
before = '    return hashlib.sha256(value.encode("utf-8")).hexdigest()[:32]'
after = '    return value'
reddens = [
  "tests/hooks/test_sink.py::test_a_marker_lands_at_two_hashed_segments_and_nowhere_else",
]

# Codex exports `PLUGIN_DATA` where Claude Code exports `CLAUDE_PLUGIN_DATA` (S1). With the
# fallback gone the sink is a `NullSink` on Codex, so every `once_key` handler silently degrades
# back to "every invocation" -- the defect the sink exists to remove, on one harness only.
[[mutation]]
name = "the sink stops recognising Codex's name for the data directory"
file = "src/keelline/hooks/sink.py"
before = '    data = env.get("CLAUDE_PLUGIN_DATA") or env.get("PLUGIN_DATA")'
