# B1. Two readers of one value. `PATH_VALUE` says what a `[paths]` value may look like and
# `fsops.checked_components` says what a path *is*; for four review rounds they disagreed about
# `docs//x.md`, `docs/x/` and `./docs`, so `plan()` reported no refusal for a value `apply()`
# could not write — and `apply()` raised part-way through the pass, with earlier artifacts on
# disk and its `finally` having already persisted the manifest. The anchor's provenance: both
# rules are read off the clone's own spelling of its own `keelline.toml`, and neither consults
# anything the clone can move, so a repository cannot choose which of the two answers it gets.
