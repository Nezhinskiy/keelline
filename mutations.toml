# The call site, which is what regressed. A TOML key is arbitrary quoted text, so this message
# joined a repository's own bytes straight into a `ConfigError` — raw ESC and raw newlines into
# a terminal and into a refusal the `init` skill is instructed to relay to a model. Reachable on
# all nine tables, and two functions from the helper written in that file for this rule. The
# *missing*-key message beside it is built from schema field names and is deliberately not
# bounded.
[[mutation]]
name = "an unknown key in a known table is echoed back raw"
file = "src/keelline/config/loader.py"
before = '''        raise ConfigError(f"[{name}] has unknown key(s): {_named(unknown, 'key')}")'''
after = '''        raise ConfigError(f"[{name}] has unknown key(s): {', '.join(unknown)}")'''
reddens = [
  "tests/config/test_loader.py::test_unknown_keys_name_the_typo_and_count_the_rest_never_quoting_them",
]

# `[budgets]` is a second reader with a second message and its own name list, so it is a second
# entry rather than a second assertion under the one above.
[[mutation]]
name = "an unknown budget key is echoed back raw"
file = "src/keelline/config/loader.py"
before = '''        raise ConfigError(f"[budgets] has unknown key(s): {_named(unknown, 'key')}")'''
after = '''        raise ConfigError(f"[budgets] has unknown key(s): {', '.join(unknown)}")'''
reddens = [
  "tests/config/test_loader.py::test_unknown_keys_name_the_typo_and_count_the_rest_never_quoting_them",
]

# A verdict a reader acts on. With `[ci] mode = "reusable"`, a released sha recorded and no
# `.github/workflows/keelline.yml`, the row reported `ok` — "[ci] ref is a released Keelline
# commit" — for a repository with no gate in it at all. That is the false green the `not pinned`
# arm eleven lines below already refuses by name, and it is the state `init` itself leaves
# whenever it reports `ci-workflow` under `skipped`. The mutation puts the false green back.
[[mutation]]
name = "doctor reports a pinned ref as ok with no workflow file to pin it in"
file = "src/keelline/doctor/checks.py"
before = '        if context.config.ci.mode == "reusable":'
after = "        if False:"
reddens = [
  "tests/doctor/test_checks.py::test_a_recorded_ref_with_no_workflow_file_at_all_is_never_green",
]

# The hermetic default the helper's own docstring promises. `machine=None` is not "no machine
# file" to the code under test: it resolves to `Path.home()/.config/keelline/config.toml`, the
# process `HOME`, which the `env` dict this helper passes cannot reach. Every case that omitted
# `machine` read the developer's real overlay on any machine that has run `keelline setup
# --overlay`, and passed only because neither this machine nor CI has one.
[[mutation]]
name = "the doctor test helper defaults machine back to the process home"
file = "tests/doctor/test_checks.py"
before = '        machine=tmp_path / "no-machine.toml" if machine is None else machine,'
after = "        machine=machine,"
reddens = [
  "tests/doctor/test_checks.py::test_no_case_here_can_read_the_developers_own_machine_configuration",
]

# The third enumerated-value leak in this loader, after `_build`'s and `_budgets`'. `!r` escapes
# the control characters, which is why it read as milder than the raw bytes those two printed —
# but `keelline.state`, `memory.mode` and `ci.mode` are repository-authored and bounded by no
# grammar, so what it prints is unbounded in content and in length, and the same branch deleted
# `; got {project.name!r}` from the refusal one screen below on exactly this reasoning.
[[mutation]]
name = "a configuration enum quotes the value back again"
file = "src/keelline/config/loader.py"
before = '''        raise ConfigError(f"{section}.{key} must be one of {', '.join(allowed)}")'''
after = '''        raise ConfigError(f"{section}.{key} must be one of {', '.join(allowed)}; got {value!r}")'''
reddens = [
  "tests/config/test_loader.py::test_an_enumerated_value_is_refused_without_being_quoted",
]

# One line for both halves of the bound, because one regex holds both. Unbounded `\d+` restores
# the `ValueError` past CPython's 4300-digit `int()` cap — which `doctor` renders as "this check
# could not run" and the session handler's backstop swallows along with every other line of the
# same result, `NOT_ATTACHED` included — and restores the Unicode-aware digit class, which let a
# floor written in Eastern Arabic-Indic numerals validate and print back verbatim.
[[mutation]]
name = "the version grammar stops bounding its components"
file = "src/keelline/overlay/requires.py"
before = '_COMPONENT = r"([0-9]{1,9})"'
after = '_COMPONENT = r"(\d+)"'
reddens = [
  "tests/overlay/test_requires.py::test_a_component_too_long_to_convert_is_unreadable_and_not_an_exception",
  "tests/overlay/test_requires.py::test_only_ascii_digits_are_a_version",
  "tests/attach/test_hooks.py::test_an_unreadable_floor_costs_its_own_line_and_never_the_whole_result",
]
