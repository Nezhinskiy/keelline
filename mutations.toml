# and left the trailer in a record nothing judged — the CI gate voided for that commit by one
# byte, the same class as the trailing-space bypass this branch already fixed once.
[[mutation]]
name = "the commit stream is split on a byte a message can carry"
file = "src/keelline/guards/commit.py"
before = '    fields = completed.stdout.split("\x00")'
after = '    fields = completed.stdout.split("\x01")'
reddens = [
  "tests/guards/test_commit.py::test_a_control_byte_in_a_body_does_not_split_the_commit_into_two_records",
]

