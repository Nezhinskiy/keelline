# `inputs.path` is appended to `$GITHUB_OUTPUT`, which the runner parses line by line, so a
# `path:` carrying a newline writes further `key=value` lines — and the keys the very next steps
# read are `base`, `state` and `enforce`. `enforce` is the whole of DC7's teeth. Disable the
# character check and a caller's `path:` decides whether an installed project's gates enforce.
[[mutation]]
name = "the reusable workflow lets `path:` write its own outputs"
file = ".github/workflows/check.yml"
before = "            *[!A-Za-z0-9._/-]*)"
after = "            unmatchable-pattern-that-is-never-a-path)"
reddens = [
  "tests/test_fixtures.py::test_a_path_input_cannot_write_the_steps_own_outputs",
]

# The same reader, and the shape it could not see for the opposite reason: a step whose first
# key is `run` carries the list dash on the same line, which is the ordinary spelling for a step
# with no `name`. Drop the strip and every such step is invisible — a whole workflow written that
# way reports no shell at all, and the per-file floor excuses it for having none.
[[mutation]]
name = "the workflow scan goes blind to a step with no name"
file = "tests/test_fixtures.py"
before = '        if stripped.startswith("- "):'
after = "        if False:"
reddens = [
  "tests/test_fixtures.py::test_a_run_key_owns_every_line_indented_past_it",
]

# And the error in the other direction, which is the one that cries wolf: a block scalar's extent
# is measured from the KEY's column. Measure it from the line's start instead and a dashed step's
# block swallows the step's own sibling keys — `env:` among them, which is exactly where a
# `${{ }}` is supposed to live, so the scan reports a finding on the remedy it exists to enforce.
[[mutation]]
name = "a dashed step's block scalar swallows its own env block"
file = "tests/test_fixtures.py"
before = '        indent = line.index("run:")'
after = "        indent = len(line) - len(line.lstrip())"
reddens = [
  "tests/test_fixtures.py::test_a_run_key_owns_every_line_indented_past_it",
]

# The whole-tree gate's other silence, one step along from reading nothing: `_text` answering the
# empty string for every file keeps the file count full and the undecodable count at zero, every
# parametrised case scans `""` and passes, and the run looks identical to a clean tree. The
# character floor is what tells those two apart.
[[mutation]]
name = "the whole-tree gate reads every file as empty"
file = "tests/test_neutral.py"
before = '        return path.read_text(encoding="utf-8")'
after = '        return ""'
reddens = [
  "tests/test_neutral.py::test_the_gate_reads_the_whole_tree",
]

# `check.yml`'s verdict is three lines of shell that decide whether a failed gate fails the job,
# which is the whole of D8's advisory rule. Pin the last line true and an installed project's
# red gate reports green — the gate running is not the gate enforcing.
[[mutation]]
name = "the verdict stops failing the job for a failed gate"
file = ".github/workflows/check.yml"
before = '          [ "$ENFORCE" != true ] || [ "$failed" -eq 0 ]'
after = "          true"
reddens = [
  "tests/test_fixtures.py::test_the_verdict_fails_the_job_only_where_the_base_says_installed",
]

# "Every gate ran, whatever the first one said" is the step's own claim and the reason the five
# gate steps are `continue-on-error`. Shorten the loop to the first gate and a project fixing its
# documents pays a round trip per finding, while every other assertion about the verdict still
# holds.
[[mutation]]
name = "the verdict reports only the first gate"
file = ".github/workflows/check.yml"
before = '          for pair in "docs:$O_DOCS" "bugs:$O_BUGS" "plan:$O_PLAN" "commit:$O_COMMIT" "trail:$O_TRAIL"; do'
after = '          for pair in "docs:$O_DOCS"; do'
reddens = [
  "tests/test_fixtures.py::test_every_gate_is_named_in_the_verdict_and_not_only_the_first",
]

# DC7's equality rule applies "on any branch but the base branch itself". A push to the base
# branch IS the change, so dropping the exemption refuses every merge into it — the gate failing
# closed on the one ref that can never satisfy it.
[[mutation]]
name = "the base branch is compared against itself"
file = ".github/workflows/check.yml"
before = '            if [ "$CURRENT_REF" != "refs/heads/$base" ] && ! git diff --quiet "origin/$base" -- "$file"; then'
after = '            if ! git diff --quiet "origin/$base" -- "$file"; then'
reddens = [
  "tests/test_fixtures.py::test_the_base_branch_itself_is_exempt_from_the_equality_rule",
]

# And D8's other half: while the base's state is `initialised` or `adopting` the branch may
# change the configuration, and the run warns rather than refusing. Refuse there and a project
# adopting the gate cannot land the pull request that adopts it.
[[mutation]]
name = "a differing configuration is refused before the base says installed"
file = ".github/workflows/check.yml"
before = '              if [ "$state" = installed ]; then'
after = "              if true; then"
reddens = [
  "tests/test_fixtures.py::test_a_differing_configuration_under_a_base_that_is_not_installed_warns",
]

# The rule that replaced four rounds of shape enumeration: a `run:` key owns every following
# line indented past the key's column. Drop the continuation and every multi-line body — a block
# scalar, an indented plain scalar, a plain scalar that continues onto the next line, a quoted
# one that wraps — is truncated to what stood on the key's own line, which for a block scalar is
# the fold marker alone. Truncated bodies still count toward the floor, so the scan reports
# clean over scripts it never read.
[[mutation]]
name = "a run key stops owning the lines indented past it"
file = "tests/test_fixtures.py"
before = "            body.append(following)"
after = "            pass"
reddens = [
  "tests/test_fixtures.py::test_a_run_key_owns_every_line_indented_past_it",
  # And the scan's own size floor, which exists for exactly this: nine bodies are still
  # collected from `check.yml`, so the COUNT floor passes while every one of them has been
  # truncated to what stood on the key's line.
  "tests/test_fixtures.py::test_no_workflow_splices_an_expression_into_a_shell",
]

# And the same rule at the other end: the value that stands on the key's own line. Drop it and
# every one-liner is collected as the empty string while its continuation survives, so
# `run: echo one ${{ … }}` on a single line escapes the scan entirely.
[[mutation]]
name = "a run key drops the value on its own line"
file = "tests/test_fixtures.py"
before = '        body = [rest] if (rest := stripped[len("run:") :].strip()) else []'
after = '        body = [] if (rest := stripped[len("run:") :].strip()) else []'
reddens = [
  "tests/test_fixtures.py::test_a_run_key_owns_every_line_indented_past_it",
]

# The one shape the indentation rule cannot reach — a step spelled as a flow mapping, which has
