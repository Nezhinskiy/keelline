# S8, and the anchor half of it. `git` is a program this file CHOOSES, resolved through the same
# `PATH` a committed `.claude/settings.json` `env` block sets -- so on the Codex hot path, where
# `CLAUDE_PROJECT_DIR` is unset and `git` is the only anchor, a clone that ships a `git` had that
# binary EXECUTED on every hook invocation, before any guard of ours, and its stdout became the
# root. Gating `KEELLINE_PYTHON_CANDIDATES` and containing the interpreter while the anchor was
# itself environment-chosen is "a redirect with a longer name" for the third time in one file.
[[mutation]]
name = "the wrapper resolves git through PATH again"
file = "hooks/run-hook.sh"
before = 'git_root=$(env -i PATH=/usr/bin:/bin HOME="${HOME:-}" "$git_bin" rev-parse --show-toplevel 2>/dev/null || true)'
after = 'git_root=$(env -i PATH="${PATH:-}" HOME="${HOME:-}" git rev-parse --show-toplevel 2>/dev/null || true)'
reddens = [
  "tests/hooks/test_wrapper.py::test_the_wrapper_never_runs_a_git_the_environment_put_on_path",
]

# A machine with no git at any absolute path has no anchor this process can trust. Degrading in
# silence would keep the shape of the containment and none of its strength -- and `doctor`'s
# wrapper row keys on a token, so a silent loss is a green row over a guard that is not there.
[[mutation]]
name = "no trustworthy git degrades in silence instead of printing a token"
file = "hooks/run-hook.sh"
before = '[ -n "$git_bin" ] || fail "KL_NO_GIT no git at any absolute candidate path, so no project root this wrapper can trust"'
after = ':'
reddens = [
  "tests/hooks/test_wrapper.py::test_no_git_at_any_absolute_path_is_a_token_rather_than_a_silent_run[closed-2]",
  "tests/hooks/test_wrapper.py::test_no_git_at_any_absolute_path_is_a_token_rather_than_a_silent_run[open-0]",
]

# The other half of S8: the containment was measured against `CLAUDE_PROJECT_DIR` alone, which
# reaches this process from the very `env` block it exists to defeat. Measured on the shipped
# wrapper: `PATH=<clone>` with `CLAUDE_PROJECT_DIR=<outside the clone>` made the clone's own
# `python3` "outside the project root" and it ran the launcher. Dropping this arm leaves exactly
# that hole, with every other line of the guard still in place.
[[mutation]]
name = "the interpreter containment stops measuring against git's answer"
file = "hooks/run-hook.sh"
before = '  under_root "$dir" "$git_project" && return 0'
after = '  :'
reddens = [
  "tests/hooks/test_wrapper.py::test_an_interpreter_in_the_git_root_is_refused_although_the_environment_names_another_root",
]

# The one `cd` in the file that was neither `CDPATH=`-cleared nor `--`-terminated, while the two
# others took both cares. With `CDPATH` set and a relative root, `cd` writes the destination it
# chose to STDOUT -- ahead of anything the launcher prints, and a hook's stdout is a contract --
# and lands in a `CDPATH`-chosen directory, so the `pwd -P` that anchors the containment then
# measures the wrong tree.
[[mutation]]
name = "the project-root cd consults CDPATH again"
file = "hooks/run-hook.sh"
before = '  CDPATH= cd -- "$root" 2>/dev/null || fail "KL_NO_ROOT the project root this entry was given cannot be entered"'
after = '  cd -- "$root" 2>/dev/null || fail "KL_NO_ROOT the project root this entry was given cannot be entered"'
reddens = [
  "tests/hooks/test_wrapper.py::test_a_cdpath_never_chooses_the_directory_the_hook_runs_in",
]

# The same line's other care. Without the `--`, a root whose name begins with `-` is parsed as
# options and the entry refuses a directory that is on disk and perfectly enterable.
[[mutation]]
name = "the project-root cd parses a root beginning with a dash as options"
file = "hooks/run-hook.sh"
before = '  CDPATH= cd -- "$root" 2>/dev/null || fail "KL_NO_ROOT the project root this entry was given cannot be entered"'
after = '  CDPATH= cd "$root" 2>/dev/null || fail "KL_NO_ROOT the project root this entry was given cannot be entered"'
reddens = [
  "tests/hooks/test_wrapper.py::test_a_project_root_whose_name_begins_with_a_dash_is_a_destination_and_not_an_option",
]

# Not a containment, but the message a containment leaves behind, and the only one a vendored
# in-tree toolchain ever sees. It was byte-identical for "a candidate was found inside the tree
# and skipped" and "there was no candidate at all" while the comment beside it claimed it "says
# what happened rather than only that nothing was found". Break the record of WHY nothing was
# found and both states print the second sentence again -- which is false in the first case, and
# names no remedy in the one case where a remedy exists.
[[mutation]]
name = "the two no-interpreter states print one message again"
file = "hooks/run-hook.sh"
before = '    skipped_in_project=1'
after = '    :'
reddens = [
  "tests/hooks/test_wrapper.py::test_the_two_states_with_no_interpreter_are_told_apart",
  "tests/hooks/test_wrapper.py::test_an_interpreter_in_the_git_root_is_refused_although_the_environment_names_another_root",
]

# Defence in depth, and the only guard in its commit with no entry here -- which is how it stayed
# a claim rather than a fact. The `KEELLINE_*` strip two lines above is what closes the seam; this
# flag is the second, independent guard, so that a later edit narrowing the strip, or a second
# variable gated on a terminal the way the wrapper gates `KEELLINE_PYTHON_CANDIDATES`, still meets
# a closed stdin. It also stops a wrapper that reads stdin holding the report open.
[[mutation]]
name = "doctor's wrapper probe inherits this process's stdin"
file = "src/keelline/doctor/checks.py"
before = "            stdin=subprocess.DEVNULL,"
after = "            stdin=None,"
reddens = [
  "tests/doctor/test_checks.py::test_the_wrapper_probe_never_inherits_this_process_stdin",
]

# `attach`'s own rule, one door over, and introduced by the commit that wrote the rule down.
# `ledger()` refuses a ledger naming files or settings keys `attach` could not have written, and
# `_write_ledger` was the thing that asked for it — from the fourth write of the run. A clone
# committing such a ledger got the ignore region, the `.codex/rules/` copies and the settings
# merge written before the exit 2, with the committed ledger still on disk for `doctor._attached`
# to key on. The mutation moves the read back below two of those writes.
[[mutation]]
name = "the ledger is read after attach has already written"
file = "src/keelline/attach/write.py"
before = '''    previous = _existing_ledger(root)
    _write_ignore_region(root)
    rules = _codex_rules(root, binding)'''
after = '''    _write_ignore_region(root)
    rules = _codex_rules(root, binding)
    previous = _existing_ledger(root)'''
reddens = [
  "tests/attach/test_write.py::test_a_ledger_no_attach_could_have_written_is_refused_before_the_first_write",
]

# `detach` cannot refuse once it has begun — by the time it reaches the link tree the settings
# and the `.codex/rules/` copies are gone, and refusing there strands a half-detached repository.
# So everything structural it *can* know beforehand has to be asked beforehand. `main_checkout`
# and `_worktrees` are the only things here that need `git`, they are pure reads, and they sat
# between the settings withdrawal and the link trees: a machine whose `git` was gone got exit 1
# with two artifacts already removed and every link still in place.
[[mutation]]
name = "detach asks git where the checkouts are after it has already withdrawn"
file = "src/keelline/attach/write.py"
before = '''    checkouts = _checkouts(root)
    allow_removed = _withdraw_settings(root, recorded)'''
after = '''    allow_removed = _withdraw_settings(root, recorded)
    checkouts = _checkouts(root)'''
reddens = [
  "tests/attach/test_detach.py::test_a_git_that_cannot_run_is_answered_before_anything_is_withdrawn",
]
