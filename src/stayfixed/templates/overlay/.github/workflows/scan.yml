# The second secret scan, so that `--no-verify` is not the last word. The pre-commit hook can
# be skipped; a push cannot.
name: scan

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only, both. `pull-requests: read` is for the action's `GET /repos/{owner}/{repo}/pulls/{n}/commits`
# on a `pull_request` run, which it needs to find the commits to scan: a private repository, which
# an overlay is, answers that endpoint only to a token holding it. Leaks are still reported
# without a write scope: the action's pull-request review comment is best-effort and its failure
# is a warning; the job fails, and the summary and artifact name the leak.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Both actions are pinned at a full-length commit sha, for the reason
      # `.pre-commit-config.yaml` one directory up gives about `rev:`: a tag is a name its owner
      # can move, and `v7` or `v3` resolving to different code tomorrow is somebody else choosing
      # what runs against a repository holding your rules and your notes, with a token. The
      # trailing comment is the release each sha is; `.github/dependabot.yml` keeps both current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history is fetched so that what the action scans is reachable: on a push or
          # a pull request, the commits that push or pull request adds; on a manual run
          # (`workflow_dispatch`), all of the history.
          fetch-depth: 0
      # A personal account needs no licence key; an organisation-owned repository does, and adds
      # `GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}` here (the action's own README).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
