# Owned by the foundation lane: [budgets], [native_caps], [defaults.*]; by the notes lane:
# [rules]. The setup lane adds every other section.

[budgets]
agents_md_lines = 300
agents_md_words = 3000
status_lines = 50
roadmap_prose_lines = 350
roadmap_prose_words = 3500
memory_index_words = 1200
startup_rules_words = 1600
volatile_notes_words = 2500
volatile_ttl_days = 30

[native_caps]
# Platform limits in their own units, read by the consumers they bound.
memory_index_lines = 200
memory_index_bytes = 25600
hook_output_chars = 10000

[defaults.keelline]
state = "initialised"
profile = ""
agents = ["claude", "codex"]
enforced = []

[defaults.project]
base_branch = "main"
release_branch = "main"

[defaults.paths]
agents_md = "AGENTS.md"
architecture = "docs/architecture"
runbooks = "docs/runbooks"
adr = "docs/adr"
specs = "docs/specs"
plans = "docs/plans"
bugs = "docs/bugs"
bug_index = "docs/bug-reports.md"
roadmap = "docs/roadmap.md"
roadmap_history = "docs/roadmap-history.md"
memory = "docs/memory"
keelline = "docs/keelline"

[defaults.memory]
mode = "local-only"
groups = ["developer", "project-stable", "project-volatile", "specs"]
index_extra = []

[defaults.ledger]
id_prefix = "BR"
code_roots = ["src", "tests", "scripts"]
evidence_boundary_required_for = ["high"]

[defaults.artifacts]
local = []

[defaults.ci]
mode = "reusable"
ref = ""
gate_branch = "main"

[defaults.gates]
builtin = ["docs", "bugs", "plan", "commit", "trail"]
custom_timeout_seconds = 600

[defaults.commit_messages]
attribution_check = true
types = ["feat", "fix", "docs", "test", "refactor", "style", "chore", "harden", "guard"]

[defaults.personal]
reply_language = ""
artifact_language = "en"
preset = "recommended"

# Standing rules the `preset-rules` bundle injects at session start, in this order.
# Each is a rule a session cannot look up in time — by the time it would, the fork is already
# picked or the reply is already in the wrong language — so each arrives whole. Neutral by
# construction: nothing here names a project, a person or a harness tool. Personal values
# (which languages, which base branch) come from the machine configuration and the project's
# own file, never from this table.

[rules]
decision-forks = """
At a genuine fork — competing designs, an ambiguous requirement, a trade-off with no obvious
default — stop and ask rather than silently picking. Routine choices with a sensible default
are not forks: pick, say which, proceed. Write the analysis first, as a message: one concrete
scenario walked through each branch, what each costs, a recommendation with its reason; then
offer the options with short labels pointing back at it, recommended first. A scope change
arriving mid-task is a fork too — judge it against what the branch was cut to deliver, out
loud, before admitting it. Before a two-way fork, look for the third framing: when every
option carries the same cost, the cost itself was not questioned. If declining an offer
destroys it, say so while it still exists.
"""

worktree-by-default = """
Feature and fix work goes into an isolated git worktree cut from the base branch, not into
the primary checkout, unless the request says otherwise in so many words. Set the worktree up
first — base verified, branch named after the work — and remember it carries source and
nothing else: no virtual environment, no installed dependencies, no private files, and a
memory store reached only through links the session made. The primary checkout stays clean,
and parallel sessions cannot collide on it.
"""

research-freshness = """
When researching best practices, tooling or the state of a fast-moving field, evidence must
be from within the last two months. Older material may be cited as background only if it is
dated explicitly, labelled as older, and confirmed still current by a fresh source. Put a
month and year beside every source; prefer official documentation, release pages and dated
papers over undated posts; check a date a fetch tool computed from a timestamp against the
page itself. When a claim rests only on an older source, say so and look for recent
confirmation before building on it.
"""

ci-after-push = """
After a push or a pull-request update, read the continuous-integration result before calling
the change ready; local verification can miss checks only the pipeline runs. Read the checks
attached to the pull request, not a query by the branch's head commit — a pull request's runs
attach to its merge reference and a head-commit query can report nothing for a healthy one.
To wait, watch the specific run by its identifier with an exit status, not a command that
returns as soon as nothing is running: a queued job satisfies "nothing running".
"""

language-by-audience = """
Language splits by audience, not by the language the request was written in. Everything
durable or collaborative — documents, code comments and docstrings, commit messages, branch
names, pull-request titles and bodies, issue and review comments — is written in the artifact
language; only what the person reads in the conversation — the reply, and any question asked
there — is written in the reply language. Both are set once in the machine configuration.
Data stays in its own language: a quoted user message, a fixture, product copy. Before
committing or opening a pull request, scan for prose in the reply language that is yours
rather than quoted, and move it.
"""

[plugins]
# Installed by `setup --preset recommended`, through each harness's own plugin command.
# Third-party skills are listed as recommendations in the README, never vendored.
#
# Unpinned, and that is a gap worth naming rather than hiding: whatever these selectors resolve
# to at install time runs in every session, and a third-party plugin can ship its own hooks and
# allow rules — a wider grant than the allow rule the trust boundary forbids Keelline's own
# author from shipping. The owner runs `setup` deliberately and can decline, and the deny-only
# invariant over `templates/` has a test while this has none. A pin belongs here when the
# marketplaces expose a version selector to pin to.
#
# Bare plugin names, not `name@marketplace`: which marketplace installs which plugin is a
# per-harness fact (a plugin can ship in different marketplaces under different names on
# different harnesses), so it is declared once per harness below rather than folded into a
# selector string that only ever worked for one of them.
install = ["superpowers", "context7"]

[plugins.claude]
# Verified 2026-09-18 against the real `claude` CLI and `gh api repos/anthropics/claude-plugins-official`:
# both `superpowers` and `context7` ship in Anthropic's own official marketplace, which every
# Claude Code install already carries (`claude plugin marketplace list` lists it with no prior
# `marketplace add`) — the add call `setup` still makes is defence in depth, not a first
# registration, and it is idempotent (`claude plugin marketplace add` on an already-added source
# answers "already on disk" and exits 0). `claude plugin install <name>@<marketplace>` is the
# measured bare form — the spike record's own transcript reports `(scope: user)` as the
# *default*, not a flag, and never passes `-y` for `install` (only for `uninstall`).
marketplace = "claude-plugins-official"
source = "anthropics/claude-plugins-official"

# Deliberately no [plugins.codex] table below: Codex has no verified non-interactive
# marketplace source for either plugin in `install` — the `superpowers` project's own install
# instructions document only an interactive `/plugins` search inside a Codex session, and the
# spike record's Codex arms only ever registered scratch local directories, never a published
# marketplace. Nothing is vendored on a guess. `install` therefore names two plugins that
# `setup` installs on Claude Code only; `setup` reports the gap as a note (never silence, never
# a failure) rather than attempting an unverified install, and README.md's "This is not a
# replacement for superpowers" paragraph tells the owner to add both by hand on Codex. A reader
# of this file, the note `setup` prints, and the README should all find the same answer.

[deny]
# Machine-level deny rules, written into the user-scope settings. Deny only, always: the
# plugin author may never ship an allow rule, and a preset is a template by another name.
global = ["Read(.env*)", "Read(**/.env*)", "Read(**/.env)"]
