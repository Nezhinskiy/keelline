# The Python profile: recommended defaults, not hard rules. Everything here is data the core
# reads without knowing it is about Python. The lines every agent is handed before its first
# command are the "Before the first command" section of rules.md, not a key here.

# A repository is a Python project when one of these is at its root.
detect = [
  "pyproject.toml", "setup.py", "setup.cfg", "requirements*.txt", "Pipfile",
  "uv.lock", "poetry.lock", "pdm.lock", "Pipfile.lock", "pylock.toml", "pylock.*.toml",
]

# The paths a path-scoped harness keys these rules on.
scope = ["**/*.py", "**/*.pyi", "pyproject.toml", "setup.cfg", "requirements*.txt"]

[[check]]
id = "lockfile-absent"
kind = "present"
level = "advice"
remedy = "an application commits the lockfile its package manager writes; a library may run unlocked on purpose. A hashed requirements file compiled by pip-tools is a lock too, and this check does not read one"
locators = [
  {at = "uv.lock"}, {at = "poetry.lock"}, {at = "pdm.lock"}, {at = "Pipfile.lock"},
  {at = "pylock.toml"}, {at = "pylock.*.toml"},
]

[[check]]
id = "lockfile-untracked"
kind = "tracked"
level = "warning"
remedy = "commit the lockfile; a project that runs unlocked on purpose lists it in .gitignore, since the package manager writes it again on the next run"
locators = [
  {at = "uv.lock"}, {at = "poetry.lock"}, {at = "pdm.lock"}, {at = "Pipfile.lock"},
  {at = "pylock.toml"}, {at = "pylock.*.toml"},
]

[[check]]
id = "requires-python"
kind = "present"
level = "warning"
remedy = "declare a minimum in [project] requires-python, for example \">=3.11\", with no upper bound"
locators = [
  {at = "pyproject.toml", toml = "project.requires-python"},
  {at = "pyproject.toml", toml = "tool.poetry.dependencies.python"},
  {at = "setup.cfg", ini = ["options", "python_requires"]},
]

[[check]]
id = "requires-python-cap"
kind = "absent"
level = "advice"
remedy = "remove the upper bound from requires-python; list the versions you test in classifiers instead"
locators = [
  {at = "pyproject.toml", toml = "project.requires-python", match = "<|~=|\\^|(^|,)\\s*=="},
]

[[check]]
id = "type-checker"
kind = "present"
level = "advice"
remedy = "configure one type checker (mypy, pyright or basedpyright, pyrefly, ty; whichever the project chooses) and pin its version"
locators = [
  {at = "pyproject.toml", toml = "tool.mypy"}, {at = "mypy.ini"}, {at = ".mypy.ini"},
  {at = "setup.cfg", ini = ["mypy"]},
  {at = "pyproject.toml", toml = "tool.pyright"}, {at = "pyrightconfig.json"},
  {at = "pyproject.toml", toml = "tool.basedpyright"},
  {at = "pyproject.toml", toml = "tool.pyrefly"}, {at = "pyrefly.toml"},
  {at = "pyproject.toml", toml = "tool.ty"}, {at = "ty.toml"},
]

# pytest reads one configuration file, the first it finds. This check accepts strictness in any
# of them, so a project whose first file is loose and whose second is strict passes it: a missed
# piece of advice, never a false one. A value is true as pytest's own INI reading spells it, and
# a flag in addopts counts only as a whole word (`--strict-config` is not `--strict`).
[[check]]
id = "pytest-strict-markers"
kind = "present"
level = "advice"
remedy = "set strict_markers = true (or strict = true with a pinned pytest) so a misspelt marker is an error"
locators = [
  {at = "pyproject.toml", toml = "tool.pytest.ini_options.strict_markers", match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "pyproject.toml", toml = "tool.pytest.ini_options.strict", match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "pyproject.toml", toml = "tool.pytest.ini_options.addopts", match = "(^|\\s)--strict(-markers)?(\\s|$)"},
  {at = "pyproject.toml", toml = "tool.pytest.strict_markers", match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "pyproject.toml", toml = "tool.pytest.strict", match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "pyproject.toml", toml = "tool.pytest.addopts", match = "(^|\\s)--strict(-markers)?(\\s|$)"},
  {at = "pytest.toml", toml = "pytest.strict_markers", match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "pytest.toml", toml = "pytest.strict", match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "pytest.toml", toml = "pytest.addopts", match = "(^|\\s)--strict(-markers)?(\\s|$)"},
  {at = ".pytest.toml", toml = "pytest.strict_markers", match = "^(?i:1|t|true|y|yes|on)$"},
  {at = ".pytest.toml", toml = "pytest.strict", match = "^(?i:1|t|true|y|yes|on)$"},
  {at = ".pytest.toml", toml = "pytest.addopts", match = "(^|\\s)--strict(-markers)?(\\s|$)"},
  {at = "pytest.ini", ini = ["pytest", "strict_markers"], match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "pytest.ini", ini = ["pytest", "strict"], match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "pytest.ini", ini = ["pytest", "addopts"], match = "(^|\\s)--strict(-markers)?(\\s|$)"},
  {at = ".pytest.ini", ini = ["pytest", "strict_markers"], match = "^(?i:1|t|true|y|yes|on)$"},
  {at = ".pytest.ini", ini = ["pytest", "strict"], match = "^(?i:1|t|true|y|yes|on)$"},
  {at = ".pytest.ini", ini = ["pytest", "addopts"], match = "(^|\\s)--strict(-markers)?(\\s|$)"},
  {at = "tox.ini", ini = ["pytest", "strict_markers"], match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "tox.ini", ini = ["pytest", "strict"], match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "tox.ini", ini = ["pytest", "addopts"], match = "(^|\\s)--strict(-markers)?(\\s|$)"},
  {at = "setup.cfg", ini = ["tool:pytest", "strict_markers"], match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "setup.cfg", ini = ["tool:pytest", "strict"], match = "^(?i:1|t|true|y|yes|on)$"},
  {at = "setup.cfg", ini = ["tool:pytest", "addopts"], match = "(^|\\s)--strict(-markers)?(\\s|$)"},
]

[[check]]
id = "pytest-addopts-marker"
kind = "absent"
level = "advice"
remedy = "a -m in addopts is a default that any -m on the command line replaces rather than narrows, so CI and a local run can select different tests; keep selection in the commands CI runs, or keep this default knowing that"
locators = [
  {at = "pyproject.toml", toml = "tool.pytest.ini_options.addopts", match = "(^|\\s)-m(\\s|$)"},
  {at = "pyproject.toml", toml = "tool.pytest.addopts", match = "(^|\\s)-m(\\s|$)"},
  {at = "pytest.toml", toml = "pytest.addopts", match = "(^|\\s)-m(\\s|$)"},
  {at = ".pytest.toml", toml = "pytest.addopts", match = "(^|\\s)-m(\\s|$)"},
  {at = "pytest.ini", ini = ["pytest", "addopts"], match = "(^|\\s)-m(\\s|$)"},
  {at = ".pytest.ini", ini = ["pytest", "addopts"], match = "(^|\\s)-m(\\s|$)"},
  {at = "tox.ini", ini = ["pytest", "addopts"], match = "(^|\\s)-m(\\s|$)"},
  {at = "setup.cfg", ini = ["tool:pytest", "addopts"], match = "(^|\\s)-m(\\s|$)"},
]

[[check]]
id = "ruff-legacy-select"
kind = "absent"
level = "advice"
remedy = "Ruff 0.16 widened its default rule set, and a select naming the old defaults keeps the old set; drop select, or keep it deliberately"
locators = [
  {at = "pyproject.toml", toml = "tool.ruff.lint.select", match = "^(E F|E4 E7 E9 F)$"},
  {at = "ruff.toml", toml = "lint.select", match = "^(E F|E4 E7 E9 F)$"},
  {at = ".ruff.toml", toml = "lint.select", match = "^(E F|E4 E7 E9 F)$"},
]
