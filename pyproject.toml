[project]
name = "keelline"
version = "0.1.0"
description = "A methodology harness for coding agents: a bug ledger, curated working memory, guards, and an adoption state machine, packaged as one plugin for Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nezhinskiy" }]
dependencies = []
keywords = ["claude-code", "codex", "agent", "plugin", "memory", "methodology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  # POSIX, and not "OS Independent": `fsops` depends on `dir_fd=`, `O_NOFOLLOW` and
  # `O_DIRECTORY`, and `_DIR_FLAGS` degrades to a bare `O_RDONLY` wherever the last two are
  # absent — which is to say the containment this package is built on does not hold there.
  "Operating System :: POSIX",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Nezhinskiy/keelline"
Repository = "https://github.com/Nezhinskiy/keelline"
Issues = "https://github.com/Nezhinskiy/keelline/issues"
Changelog = "https://github.com/Nezhinskiy/keelline/blob/main/CHANGELOG.md"

[project.scripts]
keelline = "keelline.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
# The sdist shipped `PKG-INFO`, `LICENSE`, `README.md`, `pyproject.toml` and `src/` — so a
# downstream packager (Homebrew, Debian, nixpkgs) could not run a single test against the
# artefact they most need to verify for a security-sensitive tool. CI asserted a property of
# the wheel and never looked at the sdist at all.
source-include = [
  "tests/**",
  "scripts/**",
  "CHANGELOG.md",
  "SECURITY.md",
  "docs/**",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "RELEASING.md",
  "changelog.d/**",
  "mutations.toml",
  ".claude-plugin/**",
  ".codex-plugin/**",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.12", "mypy>=1.16", "towncrier>=26.9"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["scripts/keelline"]

[tool.ruff.format]
# Ruff formats Python code blocks inside Markdown from 0.16 on. This excludes every Markdown
# file and not only `docs/plans/`, and the breadth is deliberate: each one here is a document,
# and a Python block in any of them is an illustration — a fragment mid-sentence, a snippet that
# does not parse alone, an example written to be read. `README.md`, `CONTRIBUTING.md` and
# `skills/*.md` are as much prose as the plans are, so the rule must not turn on which of them
# happens to carry a Python fence this week. The plans are where it was felt: they say of
# themselves that their code blocks are as-planned and unformatted and that reflowing one is the
# implementer's job at copy time, and without this the `uv run ruff format .` every contributor
# is told to run before every commit reflowed 1,250 lines of one and invalidated every line
# reference into it before anyone noticed.
exclude = ["*.md"]

[tool.ruff.lint]
# `S` (bandit) and `RUF` are here and the other candidates are not, measured rather than
# assumed. `S` yields four findings on this tree — `S603`/`S607` on exactly the two
# `subprocess` sites — and it is the ruleset that most directly matches this project's threat
# model: it forces each of those calls to carry an explicit `# noqa` documenting the reasoning
# where a reviewer sees it. `RUF` yields one, auto-fixable. Rejected: `PTH` (two findings, both
# actively wrong here — it flags `fsops`' deliberate syscall-level `os.chmod`/`os.replace`),
# `TRY` (78), `T20` (six legitimate CLI prints), `ASYNC` (none).
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests build hostile fixtures on purpose. `assert` is what a test is; the subprocess calls are
# `git` invocations the test itself wrote; `/tmp` appears as a *string* in fixtures about path
# handling, never as a file this suite creates (it uses `tmp_path`); and the `0o755` chmods are
# each restoring a directory the test made unreadable a few lines above, in a `finally`.
"tests/**" = ["S101", "S103", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
# `-ra` so a skip is visible in `-q` output rather than a silent dot; the other three turn a
# typo in a marker, a typo in this table, and an unexpectedly-passing `xfail` into failures
# instead of into quiet green.
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["src/keelline"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.towncrier]
package = "keelline"
package_dir = "src"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "{issue}"

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "change"
name = "Changed"
showcontent = true
