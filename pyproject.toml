[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "keelline"
version = "0.0.1"
description = "keelline was renamed to stayfixed; this package installs it and forwards the old command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["stayfixed>=0.2.0"]
authors = [{ name = "Nezhinskiy" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
keelline = "keelline:main"

[project.urls]
Successor = "https://github.com/stayfixed/stayfixed"
Source = "https://github.com/Nezhinskiy/keelline"

[tool.hatch.build.targets.wheel]
packages = ["src/keelline"]
